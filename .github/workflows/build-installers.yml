name: Build Taskagotchi Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Generate application icon
        shell: pwsh
        run: python packaging/make_icons.py

      - name: Build Taskagotchi
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Taskagotchi `
            --icon packaging/Taskagotchi.ico `
            --add-data "window/assets;window/assets" `
            --add-data "trayicon/TrayIcon.png;trayicon" `
            --hidden-import pystray._win32 `
            --hidden-import pynput.keyboard._win32 `
            --hidden-import pynput.mouse._win32 `
            packaging/app_entry.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            packaging\Taskagotchi.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Taskagotchi-Windows-Installer
          path: dist/installer/Taskagotchi-Setup-Windows-x64.exe
          if-no-files-found: error

  macos:
    name: macOS app and DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Generate application icon
        run: python packaging/make_icons.py

      - name: Build Taskagotchi.app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name Taskagotchi \
            --icon packaging/Taskagotchi.icns \
            --osx-bundle-identifier com.taskagotchi.app \
            --add-data "window/assets:window/assets" \
            --add-data "trayicon/TrayIcon.png:trayicon" \
            --hidden-import pystray._darwin \
            --hidden-import pynput.keyboard._darwin \
            --hidden-import pynput.mouse._darwin \
            packaging/app_entry.py

      - name: Ad-hoc sign application
        run: |
          codesign --force --deep --sign - dist/Taskagotchi.app

      - name: Build DMG
        run: |
          mkdir -p dist/dmg-root
          cp -R dist/Taskagotchi.app dist/dmg-root/Taskagotchi.app
          ln -s /Applications dist/dmg-root/Applications

          hdiutil create \
            -volname "Taskagotchi" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/Taskagotchi-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Taskagotchi-macOS-DMG
          path: dist/Taskagotchi-macOS.dmg
          if-no-files-found: error
